<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: Poppins; font-weight: 500; src: url(assets/Poppins-Medium.ttf); }
        @font-face { font-family: Poppins; font-weight: 800; src: url(assets/Poppins-ExtraBold.ttf); }
        #root { position: absolute; inset: 0; overflow: hidden; font-family: Poppins, sans-serif; color: #ececec; }
        #s3-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; perspective: 1400px; }
        #s3-line { display: flex; flex-wrap: wrap; justify-content: center; column-gap: 0.25em; font-size: 11vw; font-weight: 800; letter-spacing: -0.045em; line-height: 1.04; }
        .s3-w { display: block; position: relative; }
        #s3-w2 { color: var(--destaque); }
        #s3-under { position: absolute; left: 4px; right: 4px; bottom: 0.08em; height: 0.1em; border-radius: 99px; background: var(--destaque); }
        #s3-url { margin-top: 0.9em; font-size: max(2vw, 34px); font-weight: 500; color: #a3a3a3; }
        @media (orientation: portrait) { #s3-line { font-size: 20vw; } }
        #s3-glow { position: absolute; left: 50%; top: 50%; width: 80vw; height: 60vh; transform: translate(-50%, -50%); border-radius: 50%;
          background: radial-gradient(ellipse, color-mix(in srgb, var(--destaque) 20%, transparent), transparent 65%); }
      </style>
      <div id="root" data-composition-id="s3-final" data-width="1920" data-height="1080">
        <div id="s3-glow" data-layout-ignore></div>
        <div id="s3-stage" data-layout-allow-overflow>
          <div id="s3-line"><span class="s3-w" id="s3-w1">Comece</span><span class="s3-w" id="s3-w2">hoje.<i id="s3-under"></i></span></div>
          <div id="s3-url">seusite.com.br</div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const enter = { opacity: 0, yPercent: 60, rotationX: -70, filter: "blur(14px)", transformOrigin: "50% 100%" };
          const land = { opacity: 1, yPercent: 0, rotationX: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" };
          tl.fromTo("#s3-w1", enter, land, 0.03);
          tl.fromTo("#s3-w2", enter, land, 0.25);
          tl.fromTo("#s3-under", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, 0.65);
          tl.fromTo("#s3-glow", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power2.out" }, 0.4);
          tl.fromTo("#s3-url", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.9);
          // keep the end card breathing
          tl.fromTo("#s3-stage", { scale: 1 }, { scale: 1.035, duration: 3.0, ease: "none" }, 0);
          window.__timelines["s3-final"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
