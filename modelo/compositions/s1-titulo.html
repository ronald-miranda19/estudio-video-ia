<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: Poppins; font-weight: 500; src: url(assets/Poppins-Medium.ttf); }
        @font-face { font-family: Poppins; font-weight: 800; src: url(assets/Poppins-ExtraBold.ttf); }
        #root { position: absolute; inset: 0; overflow: hidden; font-family: Poppins, sans-serif; color: #ececec; }
        #s1-box { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; perspective: 1400px; }
        #s1-kicker { font-size: max(1.7vw, 28px); font-weight: 500; letter-spacing: 0.3em; color: #a3a3a3; }
        #s1-title { display: flex; flex-wrap: wrap; justify-content: center; column-gap: 0.25em; margin-top: 0.15em;
          font-size: 12vw; font-weight: 800; letter-spacing: -0.045em; line-height: 1.02; }
        .s1-w { display: block; }
        #s1-w2 { color: var(--destaque); }
        #s1-bar { width: 22vw; height: max(0.7vw, 10px); border-radius: 99px; background: var(--destaque); margin-top: 0.6em; }
        @media (orientation: portrait) { #s1-title { font-size: 21vw; } #s1-bar { width: 40vw; } }
      </style>
      <div id="root" data-composition-id="s1-titulo" data-width="1920" data-height="1080">
        <div id="s1-box">
          <div id="s1-kicker">APRESENTANDO</div>
          <div id="s1-title"><span class="s1-w" id="s1-w1">Seu</span><span class="s1-w" id="s1-w2">Produto</span></div>
          <div id="s1-bar"></div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s1-kicker", { opacity: 0, y: 24, scaleX: 1.3 }, { opacity: 1, y: 0, scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.15);
          // words land one by one, flipping up from below
          ["#s1-w1", "#s1-w2"].forEach((w, i) => {
            tl.fromTo(w, { opacity: 0, yPercent: 70, rotationX: -75, filter: "blur(16px)", transformOrigin: "50% 100%" },
              { opacity: 1, yPercent: 0, rotationX: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.45 + i * 0.3);
          });
          tl.fromTo("#s1-bar", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 1.1);
          // slow push toward the camera until the wipe takes it
          tl.fromTo("#s1-box", { scale: 1 }, { scale: 1.07, duration: 2.95, ease: "power1.in" }, 0);
          tl.to("#s1-box", { filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, 2.75);
          window.__timelines["s1-titulo"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
